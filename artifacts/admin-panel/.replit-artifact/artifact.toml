kind = "web"
previewPath = "/"
title = "Admin Panel"
version = "1.0.0"
id = "artifacts/admin-panel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20130

[services.development]
run = "npm run dev --workspace=@workspace/admin-panel"

[services.production]
build = [ "npm", "run", "build", "--workspace=@workspace/admin-panel" ]
publicDir = "artifacts/admin-panel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20130"
BASE_PATH = "/"
